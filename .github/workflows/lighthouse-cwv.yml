name: Lighthouse CWV Guardrail

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "30 2 * * *"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Start local PHP server
        run: php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &

      - name: Run Lighthouse assertions
        run: lhci autorun --config=./lighthouserc.json
